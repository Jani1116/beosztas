<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Pro Kombat - Elite Edition</title>
    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; touch-action: none; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        
        /* UI Design */
        .ui-layer { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { display: flex; justify-content: space-between; padding: 20px 40px; }
        .health-bar-wrapper { width: 40%; height: 25px; background: rgba(255,255,255,0.1); border: 3px solid #333; transform: skewX(-15deg); overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        #p1-hp { background: linear-gradient(90deg, #007aff, #5ac8fa); }
        #p2-hp { background: linear-gradient(90deg, #ff3b30, #ff9500); }
        
        .combo-counter { position: absolute; top: 80px; left: 50px; color: #fff; font-size: 30px; font-style: italic; opacity: 0; transition: opacity 0.3s; text-shadow: 2px 2px #ff3b30; }

        /* Kontrollerek */
        #joy-zone { position: fixed; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
        #knob { position: absolute; width: 60px; height: 60px; background: #fff; border-radius: 50%; left: 35px; top: 35px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        .btns { position: fixed; bottom: 40px; right: 40px; display: grid; grid-template-columns: 85px 85px; gap: 15px; pointer-events: auto; }
        .b { width: 80px; height: 80px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-align: center; backdrop-filter: blur(5px); }
        .b:active { background: #fff; color: #000; }
    </style>
</head>
<body>

<div class="ui-layer">
    <div class="hud">
        <div class="health-bar-wrapper"><div id="p1-hp" class="hp-fill"></div></div>
        <div class="health-bar-wrapper"><div id="p2-hp" class="hp-fill"></div></div>
    </div>
    <div id="combo-ui" class="combo-counter">0 HIT COMBO</div>
</div>

<div id="joy-zone"><div id="knob"></div></div>
<div class="btns">
    <div class="b" id="b-hp">NAGY<br>ÜTÉS</div><div class="b" id="b-lp">KIS<br>ÜTÉS</div>
    <div class="b" id="b-hk">NAGY<br>RÚGÁS</div><div class="b" id="b-lk">KIS<br>RÚGÁS</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let floor, lastTime = 0, shake = 0, particles = [];
let comboCount = 0, comboTimer = 0;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    floor = canvas.height * 0.8;
}
window.addEventListener('resize', resize);
resize();

// Effekt rendszer (Vér/Szikra)
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.alpha = 1;
        this.color = color;
    }
    update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.02; }
    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1;
    }
}

class Fighter {
    constructor(x, color, isPlayer) {
        this.x = x; this.y = floor;
        this.vx = 0; this.vy = 0;
        this.hp = 100;
        this.color = color;
        this.side = isPlayer ? 1 : -1;
        this.state = 'IDLE';
        this.frame = 0;
        this.onGround = true;
        this.hitStun = 0;
    }

    update(opp, dt) {
        const m = dt / 16;
        if (this.hitStun > 0) this.hitStun -= m;

        this.vy += 1.2 * m;
        this.x += this.vx * m;
        this.y += this.vy * m;
        this.vx *= Math.pow(0.8, m);

        if (this.x < 60) this.x = 60;
        if (this.x > canvas.width - 60) this.x = canvas.width - 60;
        if (this.y >= floor) { this.y = floor; this.vy = 0; this.onGround = true; }

        if (this.onGround && this.hitStun <= 0) {
            this.side = this.x < opp.x ? 1 : -1;
            if (this.state !== 'IDLE' && this.state !== 'WALK') {
                this.frame += 1 * m;
                if (this.frame > 15) this.state = 'IDLE';
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.side, 1);
        ctx.strokeStyle = this.hitStun > 0 ? "#fff" : this.color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        let bodyY = -120, walk = (this.state === 'WALK') ? Math.sin(Date.now() * 0.015) * 20 : 0;

        // Karakter váz
        ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(0, bodyY); ctx.stroke(); // Törzs
        ctx.beginPath(); ctx.arc(0, bodyY - 20, 18, 0, Math.PI*2); ctx.stroke(); // Fej

        // Lábak mozgása
        ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(walk, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(-walk, 0); ctx.stroke();

        // Harci pózok
        let hX = 25, hY = bodyY + 30;
        if (this.state === 'HP') { hX = 80; hY = bodyY - 20; }
        if (this.state === 'LP') { hX = 70; hY = bodyY + 40; }
        
        ctx.beginPath(); ctx.moveTo(0, bodyY + 30); ctx.lineTo(hX, hY); ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath(); ctx.arc(hX, hY, 12, 0, Math.PI*2); ctx.fill(); // Kesztyű

        if (this.state === 'HK') { ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(60, bodyY-10); ctx.stroke(); }
        if (this.state === 'LK') { ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(70, -60); ctx.stroke(); }

        ctx.restore();
    }
}

const p1 = new Fighter(200, '#007aff', true);
const p2 = new Fighter(window.innerWidth - 200, '#ff3b30', false);

function doHit(p, opp, dmg) {
    if (Math.abs(p.x - opp.x) < 130) {
        opp.hp -= dmg;
        opp.hitStun = 10;
        opp.vx = p.side * 15;
        shake = 10;
        for(let i=0; i<8; i++) particles.push(new Particle(opp.x, opp.y - 100, opp.color));
        
        if (p === p1) {
            comboCount++;
            comboTimer = 60;
            const ui = document.getElementById('combo-ui');
            ui.innerText = comboCount + " HIT COMBO";
            ui.style.opacity = 1;
        }
        
        document.getElementById(p === p1 ? 'p2-hp' : 'p1-hp').style.width = Math.max(0, opp.hp) + '%';
    }
}

// Gomb események
const setupBtn = (id, type, dmg) => {
    document.getElementById(id).addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (p1.state === 'IDLE' || p1.state === 'WALK') {
            p1.state = type; p1.frame = 0;
            doHit(p1, p2, dmg);
        }
    });
};
setupBtn('b-hp', 'HP', 15); setupBtn('b-lp', 'LP', 7);
setupBtn('b-hk', 'HK', 18); setupBtn('b-lk', 'LK', 10);

let joy = { x: 0, y: 0, active: false };
const zone = document.getElementById('joy-zone');
zone.addEventListener('touchstart', (e) => { joy.active = true; e.preventDefault(); });
window.addEventListener('touchmove', (e) => {
    if (!joy.active) return;
    let t = e.touches[0], r = zone.getBoundingClientRect();
    joy.x = Math.max(-50, Math.min(50, t.clientX - (r.left + 65)));
    joy.y = Math.max(-50, Math.min(50, t.clientY - (r.top + 65)));
    document.getElementById('knob').style.transform = `translate(${joy.x}px, ${joy.y}px)`;
});
window.addEventListener('touchend', () => { joy.active = false; joy.x = 0; joy.y = 0; document.getElementById('knob').style.transform = 'translate(0,0)'; });

function loop(t) {
    let dt = t - lastTime; lastTime = t;
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,canvas.width, canvas.height);

    // Kamera rázkódás
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.9; }

    // Padló
    ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, floor); ctx.lineTo(canvas.width, floor); ctx.stroke();

    // P1 Irányítás
    if (joy.active) {
        if (Math.abs(joy.x) > 10) { p1.vx = (joy.x/50) * 8; p1.state = 'WALK'; }
        if (joy.y < -25 && p1.onGround) { p1.vy = -25; p1.onGround = false; }
    } else if (p1.state === 'WALK') p1.state = 'IDLE';

    // AI (Támadóbb és okosabb)
    if (p2.hp > 0) {
        let d = p1.x - p2.x;
        if (Math.abs(d) > 110) p2.vx = Math.sign(d) * 4;
        else if (Math.random() < 0.05 && p2.state === 'IDLE') {
            p2.state = Math.random() > 0.5 ? 'LP' : 'LK'; p2.frame = 0;
            doHit(p2, p1, 5);
        }
    }

    // Combo rendszer kezelése
    if (comboTimer > 0) { comboTimer--; } else { document.getElementById('combo-ui').style.opacity = 0; comboCount = 0; }

    // Update & Draw
    p1.update(p2, dt); p2.update(p1, dt);
    p1.draw(); p2.draw();
    
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => { p.update(); p.draw(); });

    ctx.restore();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
