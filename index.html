<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beosztás PRO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --danger: #ff453a; --success: #30d158; --warning: #ff9f0a;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); -webkit-tap-highlight-color: transparent; user-select: none; }
        .container { max-width: 600px; margin: auto; background: #121212; padding: 15px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); box-sizing: border-box; min-height: 95vh; display: flex; flex-direction: column; }
        
        .nav-group { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; padding: 0 8px; }
        .nav-title { font-weight: bold; font-size: 15px; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card); padding: 10px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .edit-toggle-btn { background: var(--border); color: var(--secondary); border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .edit-toggle-btn.active { background: var(--warning); color: #000; }

        .schedule-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .schedule-table th, .schedule-table td { border: 1px solid var(--border); text-align: center; padding: 6px 2px; }
        .schedule-table th { background: #1a1a1c; font-size: 11px; color: var(--secondary); }
        .day-header-name { font-size: 12px; color: var(--accent); display: block; }
        .day-header-num { font-size: 10px; color: var(--secondary); display: block; margin-top: 2px; }
        
        .name-col { text-align: left !important; padding-left: 10px !important; font-size: 13px; font-weight: bold; width: 85px; white-space: nowrap; }
        .cell-slot { height: 36px; cursor: pointer; font-size: 16px; vertical-align: middle; transition: background 0.1s; }
        .cell-slot.editable:active { background: #2c2c2e; }
        
        .status-check { color: var(--success); font-weight: bold; }
        .status-cross { color: var(--danger); font-weight: bold; }
        
        .separator-row td { background: #0a0a0a; height: 10px; border-left: none; border-right: none; }
        .summary-row td { background: #18181a; font-weight: bold; font-size: 13px; color: var(--warning); }

        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading-overlay">Szinkronizálás...</div>

<div id="app-container" class="container">
    <h2 style="margin: 5px 0 15px 0; font-size: 20px; text-align:center;">Heti Beosztás</h2>
    
    <!-- Év Lapozó -->
    <div class="nav-group">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="year-display" class="nav-title">2026</span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    
    <!-- Hónap Lapozó -->
    <div class="nav-group">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" class="nav-title">Július</span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <!-- Hét Lapozó -->
    <div class="nav-group" style="border-color: var(--accent);">
        <button class="nav-btn" onclick="changeWeek(-1)">❮</button>
        <span id="week-display" class="nav-title" style="color: var(--accent);">31. Hét</span>
        <button class="nav-btn" onclick="changeWeek(1)">❯</button>
    </div>

    <!-- Szerkesztés Mód Sáv -->
    <div class="toolbar">
        <span style="font-size: 13px; color: var(--secondary);">Módosítás zárolva</span>
        <button id="edit-btn" class="edit-toggle-btn" onclick="toggleEditMode()">✏️ Szerkesztés</button>
    </div>

    <!-- Táblázat -->
    <div style="overflow-x: auto; flex-grow: 1;">
        <table class="schedule-table" id="schedule-table">
            <thead>
                <tr id="table-header-row">
                    <th class="name-col">Név</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    
    const group1 = ["Móni", "Eszti", "Babi", "Andris", "Szilvi", "Ági", "Jani", "Brigi"];
    const group2 = ["Viki", "Feri"];
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
    const dayNames = ["H", "K", "Sze", "Cs", "P", "Szo", "V"];

    let currentDate = new Date();
    let scheduleData = {};
    let isEditMode = false;

    async function init() {
        await loadRemoteData();
        render();
    }

    async function loadRemoteData() {
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}beosztas_data.json`);
            const data = await res.json();
            if(data) scheduleData = data;
        } catch(e) { console.log("Offline mód"); }
        showLoading(false);
    }

    async function syncData() {
        try {
            await fetch(`${DB_URL}beosztas_data.json`, { method: 'PUT', body: JSON.stringify(scheduleData) });
        } catch(e) { console.log("Hálózati hiba mentéskor"); }
    }

    function toggleEditMode() {
        if (!isEditMode) {
            if (confirm("Szerkeszted?")) {
                isEditMode = true;
            }
        } else {
            isEditMode = false;
        }
        
        let btn = document.getElementById('edit-btn');
        if (isEditMode) {
            btn.classList.add('active');
            btn.innerText = "🔓 Szerkesztve";
        } else {
            btn.classList.remove('active');
            btn.innerText = "✏️ Szerkesztés";
        }
        render();
    }

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        let yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6:1);
        return new Date(d.setDate(diff));
    }

    function getDaysOfCurrentWeek() {
        let monday = getMonday(currentDate);
        let days = [];
        for(let i = 0; i < 7; i++) {
            let nextDay = new Date(monday);
            nextDay.setDate(monday.getDate() + i);
            days.push(nextDay);
        }
        return days;
    }

    function render() {
        document.getElementById('year-display').innerText = currentDate.getFullYear();
        document.getElementById('month-display').innerText = months[currentDate.getMonth()];
        document.getElementById('week-display').innerText = `${getWeekNumber(currentDate)}. Hét`;

        let days = getDaysOfCurrentWeek();
        
        let headerHtml = '<th class="name-col">Név</th>';
        days.forEach((day, index) => {
            headerHtml += `<th><span class="day-header-name">${dayNames[index]}</span><span class="day-header-num">${day.getDate()}</span></th>`;
        });
        document.getElementById('table-header-row').innerHTML = headerHtml;

        let bodyHtml = "";
        
        group1.forEach(name => {
            bodyHtml += renderEmployeeRow(name, days);
        });

        bodyHtml += `<tr class="separator-row"><td colspan="8"></td></tr>`;

        group2.forEach(name => {
            bodyHtml += renderEmployeeRow(name, days);
        });

        bodyHtml += `<tr class="summary-row"><td class="name-col">Összesen</td>`;
        days.forEach(day => {
            let dateStr = formatDateKey(day);
            let count = 0;
            [...group1, ...group2].forEach(name => {
                let key = `${name}_${dateStr}`;
                if(scheduleData[key] === 'check') count++;
            });
            bodyHtml += `<td>${count > 0 ? count : ''}</td>`;
        });
        bodyHtml += `</tr>`;

        document.getElementById('table-body').innerHTML = bodyHtml;
    }

    function renderEmployeeRow(name, days) {
        let row = `<tr><td class="name-col">${name}</td>`;
        days.forEach(day => {
            let dateStr = formatDateKey(day);
            let key = `${name}_${dateStr}`;
            let status = scheduleData[key] || '';
            let symbol = '';
            let cls = '';
            if(status === 'check') { symbol = '✓'; cls = 'status-check'; }
            else if(status === 'cross') { symbol = '✕'; cls = 'status-cross'; }
            
            let editableCls = isEditMode ? 'editable' : '';
            let actionAttr = isEditMode ? `onmousedown="handlePress(event, '${name}', '${dateStr}')" ontouchstart="handleTouch(event, '${name}', '${dateStr}')"` : '';
            
            row += `<td class="cell-slot ${cls} ${editableCls}" ${actionAttr}>${symbol}</td>`;
        });
        row += `</tr>`;
        return row;
    }

    function formatDateKey(d) {
        return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    let pressTimer = null;
    let isLongPress = false;

    function handlePress(e, name, dateStr) {
        if(!isEditMode) return;
        if(e.type === 'mousedown' && e.button !== 0) return;
        isLongPress = false;
        pressTimer = setTimeout(() => {
            isLongPress = true;
            toggleStatus(name, dateStr, 'cross');
        }, 500);
        
        window.addEventListener('mouseup', function mouseUpHandler() {
            clearTimeout(pressTimer);
            window.removeEventListener('mouseup', mouseUpHandler);
            if(!isLongPress) {
                toggleStatus(name, dateStr, 'check');
            }
        }, {once: true});
    }

    function handleTouch(e, name, dateStr) {
        if(!isEditMode) return;
        isLongPress = false;
        pressTimer = setTimeout(() => {
            isLongPress = true;
            toggleStatus(name, dateStr, 'cross');
        }, 500);

        let target = e.target;
        target.addEventListener('touchend', function touchEndHandler(ev) {
            clearTimeout(pressTimer);
            target.removeEventListener('touchend', touchEndHandler);
            if(!isLongPress) {
                ev.preventDefault();
                toggleStatus(name, dateStr, 'check');
            }
        }, {once: true});
    }

    async function toggleStatus(name, dateStr, type) {
        let key = `${name}_${dateStr}`;
        let current = scheduleData[key];
        
        if(type === 'cross') {
            scheduleData[key] = (current === 'cross') ? undefined : 'cross';
        } else {
            scheduleData[key] = (current === 'check') ? undefined : 'check';
        }
        
        if(!scheduleData[key]) delete scheduleData[key];
        
        render();
        await syncData();
    }

    function changeYear(n) {
        currentDate.setFullYear(currentDate.getFullYear() + n);
        render();
    }

    function changeMonth(n) {
        currentDate.setMonth(currentDate.getMonth() + n);
        render();
    }

    function changeWeek(n) {
        currentDate.setDate(currentDate.getDate() + (n * 7));
        render();
    }

    function showLoading(s) {
        document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none';
    }

    init();
</script>
</body>
</html>
