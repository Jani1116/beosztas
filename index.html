<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Kombat Fix</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        
        /* HP SÁVOK */
        .bars { position: fixed; top: 20px; width: 100%; display: flex; justify-content: space-evenly; pointer-events: none; }
        .hp-cont { width: 40%; height: 20px; background: #333; border: 2px solid #fff; border-radius: 5px; }
        .hp-fill { height: 100%; background: #f00; width: 100%; transition: width 0.2s; }

        /* JOYSTICK */
        #joy-zone { 
            position: fixed; bottom: 40px; left: 40px; width: 150px; height: 150px; 
            background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #555;
        }
        #knob { 
            position: absolute; width: 60px; height: 60px; background: #007aff; 
            border-radius: 50%; left: 45px; top: 45px; pointer-events: none;
        }
        
        /* GOMBOK - Tágasabb elrendezés */
        .btns { position: fixed; bottom: 40px; right: 40px; display: grid; grid-template-columns: 90px 90px; gap: 20px; }
        .b { 
            width: 85px; height: 85px; border-radius: 50%; border: 4px solid #fff; 
            color: #fff; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; background: rgba(0,0,0,0.7); font-size: 20px;
        }
        #b-hp { border-color: #ff3b30; } #b-lp { border-color: #007aff; }
        #b-hk { border-color: #ffcc00; } #b-lk { border-color: #30d158; }
    </style>
</head>
<body>

<div class="bars">
    <div class="hp-cont"><div id="p1-hp" class="hp-fill"></div></div>
    <div class="hp-cont"><div id="p2-hp" class="hp-fill"></div></div>
</div>

<div id="joy-zone"><div id="knob"></div></div>
<div class="btns">
    <div class="b" id="b-hp">HP</div><div class="b" id="b-lp">LP</div>
    <div class="b" id="b-hk">HK</div><div class="b" id="b-lk">LK</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const floor = canvas.height * 0.8;

class Fighter {
    constructor(x, color, side) {
        this.x = x; this.y = floor;
        this.vx = 0; this.vy = 0;
        this.hp = 100;
        this.color = color;
        this.side = side; 
        this.state = 'IDLE';
        this.animFrame = 0;
        this.onGround = true;
        this.rot = 0;
    }

    update(opp) {
        this.vy += 1.5;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.85;

        if (this.y >= floor) {
            this.y = floor;
            this.vy = 0;
            this.onGround = true;
            this.rot = 0;
        }

        if (this.onGround && this.state !== 'HIT') {
            this.side = this.x < opp.x ? 1 : -1;
        }

        if (!this.onGround && Math.abs(this.vx) > 2) {
            this.rot += 0.2 * Math.sign(this.vx);
        }

        if (this.state !== 'IDLE' && this.state !== 'WALK') {
            this.animFrame++;
            if (this.animFrame > 12) this.state = 'IDLE';
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.scale(this.side, 1);
        
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        let walk = (this.state === 'WALK') ? Math.sin(Date.now() * 0.012) * 25 : 0;
        let bodyY = -140;
        let hipY = -70;

        // Törzs és fej
        ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(0, bodyY); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, bodyY-20, 15, 0, Math.PI*2); ctx.stroke();

        // Lábak - Szimmetrikus mozgás
        this.drawLimb(0, hipY, walk, 0, true);
        this.drawLimb(0, hipY, -walk, 0, true);

        // Karok - Harci póz vagy ütés
        let lArm = 20, rArm = -20, armY = 20;
        if (this.state === 'LP') lArm = 70;
        if (this.state === 'HP') lArm = 90;
        if (this.state === 'LK') { walk = 60; }
        if (this.state === 'HK') { walk = 80; }

        this.drawLimb(0, bodyY + 30, lArm, armY, false);
        this.drawLimb(0, bodyY + 30, rArm, armY, false);

        ctx.restore();
    }

    drawLimb(sx, sy, tx, ty, isLeg) {
        let bend = isLeg ? 15 : -10;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(tx/2 + bend, sy + 35);
        ctx.lineTo(tx, sy + 70 + ty);
        ctx.stroke();
    }
}

const p1 = new Fighter(canvas.width * 0.25, '#fff', 1);
const p2 = new Fighter(canvas.width * 0.75, '#ff3b30', -1);

// IRÁNYÍTÁS JAVÍTÁSA
let joy = { x: 0, y: 0, active: false };
const zone = document.getElementById('joy-zone');
const knob = document.getElementById('knob');

zone.addEventListener('touchstart', (e) => { joy.active = true; });
window.addEventListener('touchmove', (e) => {
    if (!joy.active) return;
    let t = e.touches[0];
    let r = zone.getBoundingClientRect();
    let dx = t.clientX - (r.left + 75);
    let dy = t.clientY - (r.top + 75);
    let d = Math.min(50, Math.sqrt(dx*dx + dy*dy));
    let ang = Math.atan2(dy, dx);
    joy.x = Math.cos(ang) * d;
    joy.y = Math.sin(ang) * d;
    knob.style.transform = `translate(${joy.x}px, ${joy.y}px)`;
});
window.addEventListener('touchend', () => {
    joy.active = false; joy.x = 0; joy.y = 0;
    knob.style.transform = `translate(0,0)`;
});

function attack(p, type, dmg) {
    if (p.state !== 'IDLE' && p.state !== 'WALK') return;
    p.state = type; p.animFrame = 0;
    let opp = (p === p1) ? p2 : p1;
    if (Math.abs(p.x - opp.x) < 120) {
        opp.hp -= dmg;
        opp.vx = p.side * 15;
        document.getElementById((p === p1 ? 'p2' : 'p1') + '-hp').style.width = opp.hp + '%';
    }
}

// GOMBOK ESEMÉNYKEZELŐI
const bindBtn = (id, type, dmg) => {
    document.getElementById(id).addEventListener('touchstart', (e) => {
        e.preventDefault();
        attack(p1, type, dmg);
    });
};
bindBtn('b-lp', 'LP', 5); bindBtn('b-hp', 'HP', 10);
bindBtn('b-lk', 'LK', 7); bindBtn('b-hk', 'HK', 12);

function loop() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Mozgás
    if (joy.active) {
        if (Math.abs(joy.x) > 10) {
            p1.vx = (joy.x/50) * 8;
            if (p1.onGround) p1.state = 'WALK';
        }
        if (joy.y < -30 && p1.onGround) { p1.vy = -25; p1.onGround = false; }
    } else if (p1.onGround && p1.state === 'WALK') {
        p1.state = 'IDLE';
    }

    // AI
    let dist = p1.x - p2.x;
    if (p2.hp > 0) {
        if (Math.abs(dist) > 130) p2.vx = Math.sign(dist) * 3.5;
        if (Math.abs(dist) < 110 && Math.random() < 0.04) attack(p2, 'LP', 2);
    }

    p1.update(p2); p2.update(p1);
    p1.draw(); p2.draw();

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
