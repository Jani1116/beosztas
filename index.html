<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Next-Gen Fighter</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; filter: contrast(1.2) brightness(1.1); }
        .ui { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .btn { 
            width: 80px; height: 80px; border-radius: 50%; 
            background: rgba(255,255,255,0.1); border: 2px solid #007aff;
            color: #007aff; font-weight: bold; pointer-events: auto;
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui">
    <div class="btn" id="moveBtn">MOZGÁS</div>
    <div class="btn" id="atkBtn" style="border-color: #ff453a; color: #ff453a;">ÜTÉS</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 2026-os Procedurális Karakter Modell (Ízületek)
    const character = {
        x: canvas.width / 2,
        y: canvas.height - 150,
        bones: {
            head: { x: 0, y: -120 },
            shoulder: { x: 0, y: -90 },
            elbow: { x: 30, y: -60 },
            hand: { x: 50, y: -40 }
        },
        time: 0,
        isAttacking: false
    };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Háttér fényeffekt (Neon)
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#007aff';
        
        character.time += 0.05;
        
        // Alap lélegző animáció (matematikailag számolva)
        let breathing = Math.sin(character.time) * 5;
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        ctx.beginPath();
        // Gerinc rajzolása
        ctx.moveTo(character.x, character.y);
        ctx.lineTo(character.x, character.y + character.bones.shoulder.y + breathing);
        
        // Kar rajzolása (Ütés logika)
        let punchX = character.isAttacking ? 100 : character.bones.hand.x;
        ctx.lineTo(character.x + punchX, character.y + character.bones.shoulder.y + breathing);
        
        ctx.stroke();

        requestAnimationFrame(draw);
    }

    document.getElementById('atkBtn').addEventListener('pointerdown', () => {
        character.isAttacking = true;
        setTimeout(() => character.isAttacking = false, 150);
    });

    draw();
</script>
</body>
</html>
