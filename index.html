<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextGen Stickman Engine</title>
    <style>
        body { 
            margin: 0; background: #050505; overflow: hidden; 
            touch-action: none; overscroll-behavior: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; }

        /* KILÉPÉS GOMB */
        .exit-btn {
            position: fixed; top: 20px; right: 20px;
            width: 44px; height: 44px; background: rgba(255, 69, 58, 0.2);
            border: 1px solid #ff453a; border-radius: 50%;
            color: #ff453a; display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 1000; pointer-events: auto;
        }

        /* JOYSTICK BAL OLDALON */
        #joystick-container {
            position: fixed; bottom: 50px; left: 50px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.1);
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: #007aff; border-radius: 50%;
            box-shadow: 0 0 15px #007aff;
        }

        /* GOMBOK JOBB OLDALON (Gyémánt alakzat) */
        .action-buttons {
            position: fixed; bottom: 50px; right: 50px;
            width: 180px; height: 180px;
        }
        .btn-action {
            position: absolute; width: 55px; height: 55px;
            background: rgba(255,255,255,0.1); border: 2px solid #fff;
            border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; pointer-events: auto;
        }
        /* Gomb kiosztás */
        .btn-up    { top: 0; left: 62px; border-color: #ffcc00; } /* Nagy ütés - Fej */
        .btn-down  { bottom: 0; left: 62px; border-color: #30d158; } /* Kis rúgás - Csípő */
        .btn-left  { top: 62px; left: 0; border-color: #007aff; } /* Kis ütés - Mellkas */
        .btn-right { top: 62px; right: 0; border-color: #ff3b30; } /* Nagy ütés - Fej */
        
        .btn-action:active { transform: scale(0.9); background: white; color: black; }
    </style>
</head>
<body>

<div class="exit-btn" onclick="location.reload()">✕</div>

<div id="joystick-container">
    <div id="joystick-knob"></div>
</div>

<div class="action-buttons">
    <div class="btn-action btn-up" id="btn-B">B</div>
    <div class="btn-action btn-down" id="btn-D">D</div>
    <div class="btn-action btn-left" id="btn-A">A</div>
    <div class="btn-action btn-right" id="btn-C">C</div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // FIZIKAI ÉS KARAKTER ADATOK
    const floorY = canvas.height * 0.75;
    let fighter = {
        x: canvas.width * 0.2,
        y: floorY,
        vx: 0, vy: 0,
        dir: 1, // 1: Jobbra, -1: Balra
        state: 'idle', // idle, walk, jump, atk_low, atk_mid, atk_high
        frame: 0,
        hp: 100
    };

    // JOYSTICK LOGIKA
    let joy = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
    const knob = document.getElementById('joystick-knob');
    const joyCont = document.getElementById('joystick-container');

    joyCont.addEventListener('touchstart', e => { joy.active = true; });
    window.addEventListener('touchmove', e => {
        if (!joy.active) return;
        let touch = e.touches[0];
        let rect = joyCont.getBoundingClientRect();
        let centerX = rect.left + rect.width/2;
        let centerY = rect.top + rect.height/2;
        
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        let dist = Math.min(60, Math.sqrt(dx*dx + dy*dy));
        let angle = Math.atan2(dy, dx);
        
        joy.moveX = Math.cos(angle) * dist;
        joy.moveY = Math.sin(angle) * dist;
        
        knob.style.transform = `translate(${joy.moveX}px, ${joy.moveY}px)`;
        
        // Mozgás irányítása
        fighter.vx = (joy.moveX / 60) * 8;
        if (Math.abs(joy.moveX) > 10) fighter.state = 'walk';
    });
    window.addEventListener('touchend', () => {
        joy.active = false;
        joy.moveX = 0; joy.moveY = 0;
        knob.style.transform = `translate(0, 0)`;
        fighter.vx = 0;
        fighter.state = 'idle';
    });

    // TÁMADÁS GOMBOK
    const setAtk = (s) => { 
        fighter.state = s; 
        setTimeout(() => fighter.state = 'idle', 300); 
    };
    document.getElementById('btn-A').addEventListener('touchstart', () => setAtk('atk_mid'));  // Kis ütés
    document.getElementById('btn-B').addEventListener('touchstart', () => setAtk('atk_high')); // Nagy ütés 1
    document.getElementById('btn-C').addEventListener('touchstart', () => setAtk('atk_high')); // Nagy ütés 2
    document.getElementById('btn-D').addEventListener('touchstart', () => setAtk('atk_low'));  // Kis rúgás

    // TERMÉSZETESEBB PÁLCIKAEMBER RAJZOLÁS (IK ALAPOK)
    function drawFighter(ctx, f) {
        ctx.save();
        ctx.translate(f.x, f.y);
        
        // AUTO-FLIP: Ha túlhalad a képernyő felén, megfordul
        f.dir = (f.x > canvas.width / 2) ? -1 : 1;
        ctx.scale(f.dir, 1);

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        f.frame += 0.1;
        let breathe = Math.sin(f.frame) * 5;
        let walk = (f.state === 'walk') ? Math.sin(f.frame * 2) * 20 : 0;

        // PONTOK (Természetesebb ízületi helyek)
        let hip = { x: 0, y: -90 };
        let neck = { x: walk * 0.2, y: -160 + breathe };
        let head = { x: neck.x, y: neck.y - 25 };

        // 1. Törzs (Spine)
        ctx.beginPath();
        ctx.moveTo(hip.x, hip.y);
        ctx.bezierCurveTo(hip.x, hip.y - 30, neck.x, neck.y + 30, neck.x, neck.y);
        ctx.stroke();

        // 2. Fej
        ctx.beginPath();
        ctx.arc(head.x, head.y, 18, 0, Math.PI*2);
        ctx.stroke();

        // 3. Lábak (Térddel)
        drawLimb(ctx, hip, 45, 45, (f.state==='walk' ? walk : 10), (f.state==='atk_low' ? -60 : 20)); // Elülső láb
        drawLimb(ctx, hip, 45, 45, (f.state==='walk' ? -walk : -10), 20); // Hátsó láb

        // 4. Karok (Könyökkel)
        let shoulder = { x: neck.x, y: neck.y + 10 };
        let handTarget = 20;
        if(f.state === 'atk_mid') handTarget = 80; // Mellkas ütés
        if(f.state === 'atk_high') handTarget = 90; // Fej ütés (feljebb rántva)

        let armY = (f.state === 'atk_high') ? -40 : 10;
        drawLimb(ctx, shoulder, 35, 35, handTarget, armY); 
        drawLimb(ctx, shoulder, 35, 35, -20, 20);

        ctx.restore();
    }

    function drawLimb(ctx, start, l1, l2, targetX, targetY) {
        // Egyszerűsített IK: comb/felkar -> térd/könyök -> lábfej/kéz
        let knee = { x: start.x + targetX/2, y: start.y + l1 };
        let foot = { x: start.x + targetX, y: start.y + l1 + l2 };

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(knee.x, knee.y);
        ctx.lineTo(foot.x, foot.y);
        ctx.stroke();
    }

    function loop() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Padló
        ctx.strokeStyle = '#222';
        ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();

        // Fizika
        fighter.x += fighter.vx;
        if(fighter.x < 50) fighter.x = 50;
        if(fighter.x > canvas.width - 50) fighter.x = canvas.width - 50;

        drawFighter(ctx, fighter);
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
