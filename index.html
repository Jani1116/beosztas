<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Stickman Pro - Acrobatics</title>
    <style>
        body { 
            margin: 0; background: #050505; overflow: hidden; 
            touch-action: none; overscroll-behavior: none;
            font-family: sans-serif;
        }
        canvas { display: block; }

        /* KILÉPÉS GOMB */
        #exit-btn {
            position: fixed; top: 20px; right: 20px;
            width: 50px; height: 50px; background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff453a; border-radius: 12px;
            color: #ff453a; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; z-index: 1000; pointer-events: auto;
        }

        /* JOYSTICK */
        #joy-base {
            position: fixed; bottom: 40px; left: 40px;
            width: 140px; height: 140px; background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1); border-radius: 50%;
        }
        #joy-knob {
            position: absolute; top: 40px; left: 40px;
            width: 60px; height: 60px; background: #007aff;
            border-radius: 50%; box-shadow: 0 0 20px #007aff;
        }

        /* AKCIÓ GOMBOK */
        .btn-panel {
            position: fixed; bottom: 40px; right: 40px;
            width: 200px; height: 200px;
        }
        .btn {
            position: absolute; width: 65px; height: 65px;
            border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; background: rgba(255,255,255,0.1);
        }
        /* Elrendezés */
        #btn-B { top: 0; left: 67px; border-color: #ffcc00; }    /* Nagy Ütés */
        #btn-D { bottom: 0; left: 67px; border-color: #30d158; } /* Kis Rúgás */
        #btn-A { top: 67px; left: 0; border-color: #007aff; }    /* Kis Ütés */
        #btn-C { top: 67px; right: 0; border-color: #ff3b30; }   /* Nagy Ütés */
        
        .btn:active { transform: scale(0.9); background: white; color: black; }
    </style>
</head>
<body>

<div id="exit-btn">✕</div>

<div id="joy-base">
    <div id="joy-knob"></div>
</div>

<div class="btn-panel">
    <div class="btn" id="btn-B">B</div>
    <div class="btn" id="btn-D">D</div>
    <div class="btn" id="btn-A">A</div>
    <div class="btn" id="btn-C">C</div>
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const floorY = canvas.height * 0.75;
    let f = {
        x: canvas.width * 0.3, y: floorY,
        vx: 0, vy: 0, rot: 0,
        dir: 1, state: 'idle',
        onGround: true, time: 0
    };

    // JOYSTICK KEZELÉS
    let j = { active: false, x: 0, y: 0 };
    const knob = document.getElementById('joy-knob');
    const base = document.getElementById('joy-base');

    base.addEventListener('touchstart', e => { j.active = true; });
    window.addEventListener('touchmove', e => {
        if(!j.active) return;
        let t = e.touches[0];
        let r = base.getBoundingClientRect();
        let dx = t.clientX - (r.left + 70);
        let dy = t.clientY - (r.top + 70);
        let d = Math.min(50, Math.sqrt(dx*dx + dy*dy));
        let angle = Math.atan2(dy, dx);
        j.x = Math.cos(angle) * d;
        j.y = Math.sin(angle) * d;
        knob.style.transform = `translate(${j.x}px, ${j.y}px)`;
    });
    window.addEventListener('touchend', () => {
        j.active = false; j.x = 0; j.y = 0;
        knob.style.transform = `translate(0,0)`;
    });

    // AKCIÓK ÉS KILÉPÉS
    document.getElementById('exit-btn').onclick = () => { if(confirm("Kilépsz?")) location.reload(); };
    
    const setAtk = (s) => { f.state = s; setTimeout(()=> { if(f.state===s) f.state='idle'; }, 250); };
    document.getElementById('btn-A').ontouchstart = () => setAtk('atk_mid');
    document.getElementById('btn-B').ontouchstart = () => setAtk('atk_high');
    document.getElementById('btn-C').ontouchstart = () => setAtk('atk_high');
    document.getElementById('btn-D').ontouchstart = () => setAtk('atk_low');

    function drawLimb(ctx, start, l1, l2, targetX, targetY, isLeg) {
        let bend = (isLeg) ? 20 : -20;
        let knee = { x: start.x + targetX/2 + bend, y: start.y + l1 };
        let foot = { x: start.x + targetX, y: start.y + l1 + l2 + targetY };
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(knee.x, knee.y);
        ctx.lineTo(foot.x, foot.y);
        ctx.stroke();
    }

    function loop() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0,0,canvas.width, canvas.height);

        // PADLÓ
        ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();

        // IRÁNYÍTÁS ÉS FIZIKA
        if(f.onGround) {
            f.vx = (j.x / 50) * 8;
            if(j.y < -30) { f.vy = -22; f.onGround = false; } // Ugrás
            if(j.y > 30) f.state = 'crouch';
            else if(Math.abs(f.vx) > 1) f.state = 'walk';
            else if(!f.state.startsWith('atk')) f.state = 'idle';
        } else {
            f.vy += 1.2; // Gravitáció
            f.y += f.vy;
            f.x += f.vx;
            // SZALTÓ LOGIKA: Ha ugrunk és mozogunk oldalra
            if(Math.abs(f.vx) > 2) f.rot += 0.2 * (f.vx > 0 ? 1 : -1);
            else f.rot = 0;

            if(f.y >= floorY) { f.y = floorY; f.onGround = true; f.rot = 0; }
        }

        f.x += f.vx;
        f.dir = (f.x > canvas.width / 2) ? -1 : 1;

        // RAJZOLÁS
        ctx.save();
        ctx.translate(f.x, f.y - (f.state==='crouch'? 40 : 0));
        ctx.rotate(f.rot);
        ctx.scale(f.dir, 1);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineCap = 'round';

        f.time += 0.1;
        let b = (f.state==='idle') ? Math.sin(f.time)*5 : 0;
        let w = (f.state==='walk') ? Math.sin(f.time*2)*20 : 0;

        let hip = { x: 0, y: -80 };
        let neck = { x: w*0.2, y: -150 + b };
        
        // TEST ÉS FEJ
        ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(neck.x, neck.y-25, 18, 0, Math.PI*2); ctx.stroke();

        // LÁBAK
        let legX = (f.state==='walk') ? w : (f.state==='atk_low' ? 70 : 10);
        drawLimb(ctx, hip, 40, 40, legX, 0, true);
        drawLimb(ctx, hip, 40, 40, -legX/2, 0, true);

        // KAROK
        let sh = { x: neck.x, y: neck.y + 10 };
        let atkX = f.state==='atk_mid' ? 80 : (f.state==='atk_high' ? 90 : 20);
        let atkY = f.state==='atk_high' ? -50 : 10;
        drawLimb(ctx, sh, 35, 35, atkX, atkY, false);
        drawLimb(ctx, sh, 35, 35, -20, 20, false);

        ctx.restore();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
